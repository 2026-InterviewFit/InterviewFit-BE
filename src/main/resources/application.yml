spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interview_fit}
    username: ${DB_USERNAME:interview}
    password: ${DB_PASSWORD:interview1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never
      encoding: UTF-8
      separator: "@@"

  defer-datasource-initialization: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 22
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: http://localhost:3000/oauth/kakao/callback
            client-id: ${KAKAO_REST_API_KEY:}
            client-secret: ${KAKAO_CLIENT_SECRET:}

fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:videos}

app:
  upload-dir: uploads/
  group-interview:
    comparison-feedback-enabled: ${GROUP_INTERVIEW_COMPARISON_FEEDBACK_ENABLED:true}

jwt:
  secret: ${JWT_SECRET:local-dev-only-not-a-real-secret-just-for-testing-12345}
  access-expiration-ms: 3600000
  refresh-expiration-ms: 1209600000

livekit:
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}
  url: ${LIVEKIT_URL:http://localhost:7880}
