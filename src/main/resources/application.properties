spring.application.name=InterviewFit-BE

# Multipart
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interview_fit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:interview}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:interview1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# FastAPI
fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000}

# Upload
app.upload-dir=${UPLOAD_DIR:${user.dir}/uploads}

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket=${MINIO_BUCKET:interview-videos}