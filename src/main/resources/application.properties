spring.application.name=InterviewFit-BE

# Multipart
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/interview_fit
spring.datasource.username=interview
spring.datasource.password=interview1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# FastAPI
fastapi.base-url=http://localhost:8000

# MinIO
storage.minio.endpoint=http://localhost:9000
storage.minio.access-key=minioadmin
storage.minio.secret-key=minioadmin123
storage.minio.bucket=interview-videos