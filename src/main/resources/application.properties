# ============================
# PostgreSQL
# ============================
spring.datasource.url=jdbc:postgresql://localhost:5432/interview_fit
spring.datasource.username=interview
spring.datasource.password=interview1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================
# FastAPI AI Server
# Local: http://localhost:8000
# Docker: http://ai-server:8000
# ============================
fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000}

# ============================
# MinIO
# Local: http://localhost:9000
# Docker: http://minio:9000
# ============================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket=${MINIO_BUCKET:videos}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

app.upload-dir=uploads/


#jwt.secret=${JWT_SECRET}
jwt.secret=local-dev-only-not-a-real-secret-just-for-testing-12345
jwt.expiration-ms=3600000

# ============================
# Kakao OAuth2 (인가 코드 다이렉트 패스 방식용)
# ============================

spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:3000/oauth/kakao/callback
spring.security.oauth2.client.registration.kakao.client-id=1cf0ac9114322e265c5780dc225db7e4
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}

