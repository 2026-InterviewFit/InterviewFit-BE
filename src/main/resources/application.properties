# ============================
# PostgreSQL
# ============================
spring.datasource.url=jdbc:postgresql://localhost:5432/interview_fit
spring.datasource.username=interview
spring.datasource.password=interview1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 다대일 면접 질문 sql 자동 생성
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ============================
# FastAPI AI Server
# Local: http://localhost:8000
# Docker: http://ai-server:8000
# ============================
fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000}

# ============================
# MinIO
# Local: http://localhost:9000
# Docker: http://minio:9000
# ============================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket=${MINIO_BUCKET:videos}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

app.upload-dir=uploads/


