services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: interview-postgres
    environment:
      POSTGRES_DB: interview_fit
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: interview-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: interview-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin123; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb -p local/interview-videos;
      mc anonymous set private local/interview-videos;
      echo 'MinIO bucket created';
      exit 0;
      "

volumes:
  postgres_data:
  minio_data: